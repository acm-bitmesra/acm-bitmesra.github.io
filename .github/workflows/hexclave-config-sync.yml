name: Hexclave Config Sync

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - "hexclave.config.ts"
      - ".github/workflows/hexclave-config-sync.yml"

jobs:
  push-hexclave-config:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      # Install dependencies so any package the config file imports resolves when the CLI evaluates it.
      - name: Install dependencies
        run: |
          npm install -g bun
          bun install --frozen-lockfile
      - name: Push Hexclave config
        env:
          HEXCLAVE_PROJECT_ID: ${{ secrets.HEXCLAVE_PROJECT_ID }}
          HEXCLAVE_SECRET_SERVER_KEY: ${{ secrets.HEXCLAVE_SECRET_SERVER_KEY }}
          HEXCLAVE_CONFIG_PATH: "hexclave.config.ts"
          HEXCLAVE_SOURCE_REPO: ${{ github.repository }}
          HEXCLAVE_SOURCE_WORKFLOW_PATH: ".github/workflows/hexclave-config-sync.yml"
        run: npx --yes @hexclave/cli@latest config push --config-file "$HEXCLAVE_CONFIG_PATH" --source github --source-repo "$HEXCLAVE_SOURCE_REPO" --source-path "$HEXCLAVE_CONFIG_PATH" --source-workflow-path "$HEXCLAVE_SOURCE_WORKFLOW_PATH"
